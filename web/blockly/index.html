<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a655c" />
    <title>Robotont web app</title>
    <link rel="stylesheet" href="/src/blockly/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <h1>Robotont web app</h1>
        <nav class="tabs" aria-label="Pages">
          <a href="/">Overview</a>
          <a href="/blockly/" aria-current="page">Blockly</a>
          <a href="/status/">Status</a>
        </nav>
        <div class="connection">
          <span id="online" class="dot"></span><span id="connection">Connecting…</span>
        </div>
      </header>
      <nav class="toolbar" aria-label="Program tools">
        <button id="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button
        ><button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button
        ><button id="clear" class="icon" title="Start a new program" aria-label="New program">
          ✕
        </button>
        <button id="save" class="secondary">Save</button
        ><button id="load" class="secondary">Open</button>
        <input id="file" type="file" accept=".json,application/json" hidden />
      </nav>
      <main>
        <section class="editor">
          <div id="workspace" aria-label="Blockly program editor"></div>
          <!-- Moved to the top of the block list by main.js -->
          <select id="levels" aria-label="Block set">
            <option value="1">Basic</option>
            <option value="2">All blocks</option>
          </select>
          <div id="banner" class="banner" hidden></div>
          <div class="run-controls">
            <button id="run" class="run" title="Run the program (Ctrl+Enter)">
              <span aria-hidden="true">▶</span> Run
            </button>
            <button id="stop" class="stop" title="Stop the program and the robot (Esc)">
              <span aria-hidden="true">■</span> Stop
            </button>
          </div>
        </section>
        <aside>
          <article class="card">
            <div class="card-title">
              <h2>Robot</h2>
              <span id="battery" class="tag">Battery —</span>
            </div>
            <svg id="status" viewBox="-145 -122 290 244" role="img" aria-labelledby="status-title">
              <title id="status-title">Lights and obstacle distances around the robot</title>
            </svg>
            <p class="hint" id="led-note">Lights show the colours the program sent.</p>
          </article>
          <article class="card">
            <div class="card-title">
              <h2>Program log</h2>
              <button id="clear-log" class="link">Clear</button>
            </div>
            <ol id="log" aria-live="polite"></ol>
          </article>
          <details id="view-card" class="card" open>
            <summary><h2>3D view</h2></summary>
            <div class="view-controls">
              <button id="follow" class="secondary small">Follow</button
              ><button id="top" class="secondary small">Top down</button>
            </div>
            <div id="scene" class="scene"></div>
          </details>
          <details id="camera-card" class="card" open>
            <summary><h2>Camera</h2></summary>
            <div class="camera">
              <img id="camera" alt="Robot camera" hidden />
              <p id="camera-note">No camera</p>
            </div>
          </details>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/blockly/main.js"></script>
  </body>
</html>
